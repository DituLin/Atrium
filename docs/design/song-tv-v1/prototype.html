<style>
@font-face{font-family:AtriumTitle;src:url(assets/title.woff2) format('woff2');font-display:swap}@font-face{font-family:AtriumBody;src:url(assets/body.woff2) format('woff2');font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#202b27;font-family:AtriumBody,"PingFang SC",sans-serif}button,select{font:inherit}button{cursor:pointer}.review{height:48px;display:flex;align-items:center;gap:12px;padding:0 18px;color:#eee9dd;background:#202b27;font:12px/1.2 sans-serif;white-space:nowrap;overflow-x:auto}.review label{display:flex;gap:6px;align-items:center}.review select,.review button{background:#35463e;color:#fff;border:1px solid #718078;border-radius:3px;padding:5px}.review strong{letter-spacing:.08em}.review .hint{margin-left:auto;color:#d0d8d2}.stage{height:calc(100dvh - 48px);width:100%;container-type:size}.screen{--u:min(.0520833cqw,.0925926cqh);--paper:#F2EEE5;--ink:#28332F;--muted:#59645D;--celadon:#315E54;--surface:#E6DFD2;--line:#a9b1a6;--focus:#315E54;--unit:calc(var(--u) * 1);width:100%;height:100%;background:var(--paper);color:var(--ink);padding:calc(72 * var(--u));display:flex;flex-direction:column;position:relative;font-size:calc(32 * var(--u));line-height:1.5;overflow:hidden}.screen.night{--paper:#202d28;--ink:#F2EEE5;--muted:#bdc7bd;--celadon:#b8d4c3;--surface:#2d3c34;--line:#63786b;--focus:#d4e4d7}.masthead{display:flex;align-items:center;justify-content:space-between;gap:1em;height:calc(56 * var(--u));flex:none;margin-bottom:calc(42 * var(--u))}.brand{font:600 calc(34 * var(--u))/1 AtriumTitle,serif;letter-spacing:.14em}.brand span{font:400 calc(22 * var(--u))/1 AtriumBody,sans-serif;letter-spacing:.12em;margin-left:calc(24 * var(--u));color:var(--muted)}.sample{font-size:calc(22 * var(--u));color:var(--muted);letter-spacing:.05em}.content{flex:1;min-height:0}.home{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:calc(72 * var(--u));height:100%}.photo-wrap{display:flex;flex-direction:column;min-height:0;gap:calc(20 * var(--u))}.hero{flex:1;min-height:0;display:block;padding:calc(18 * var(--u));background:var(--surface);border:1px solid var(--line);position:relative}.hero img{height:100%;width:100%;object-fit:contain;display:block}.photo-caption{display:flex;justify-content:space-between;align-items:center;font-size:calc(26 * var(--u));color:var(--muted)}.photo-caption b{color:var(--ink);font-weight:400}.clock-column{display:flex;flex-direction:column;justify-content:space-between;padding:calc(12 * var(--u)) 0}.date{letter-spacing:.1em;font-size:calc(30 * var(--u))}.clock{font-size:calc(126 * var(--u));line-height:1.15;letter-spacing:-.065em;font-weight:400;margin:calc(20 * var(--u)) 0}.divider{width:calc(72 * var(--u));height:2px;background:var(--celadon);margin:calc(36 * var(--u)) 0}.home-title{font:500 calc(52 * var(--u))/1.4 AtriumTitle,serif;margin:0}.quiet{color:var(--muted);font-size:calc(28 * var(--u));margin:calc(18 * var(--u)) 0 0}.status{padding:calc(24 * var(--u)) 0;text-align:left;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:none;color:var(--ink);display:flex;align-items:center;justify-content:space-between;font-size:calc(28 * var(--u));gap:calc(20 * var(--u));width:100%}.dot{display:inline-block;width:calc(12 * var(--u));height:calc(12 * var(--u));margin-right:calc(15 * var(--u));background:var(--celadon);border-radius:100%}.nav{display:flex;align-items:center;gap:calc(28 * var(--u));margin-top:calc(38 * var(--u));height:calc(76 * var(--u));flex:none}.nav button{color:var(--muted);background:none;border:0;border-bottom:calc(3 * var(--u)) solid transparent;padding:calc(12 * var(--u)) calc(24 * var(--u));font-size:calc(32 * var(--u))}.nav button.selected{color:var(--ink);border-bottom-color:var(--celadon)}.nav .keyhint{margin-left:auto;font-size:calc(24 * var(--u));color:var(--muted)}button.focus{outline:calc(5 * var(--u)) solid var(--focus);outline-offset:calc(7 * var(--u))}button:focus{outline:none}button.focus:focus{outline:calc(5 * var(--u)) solid var(--focus)}button{border-radius:calc(3 * var(--u));transition:outline-color 140ms}.page-heading{font:500 calc(56 * var(--u))/1.2 AtriumTitle,serif;margin:0}.page-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:calc(28 * var(--u))}.collections{display:flex;gap:calc(24 * var(--u));margin-bottom:calc(34 * var(--u))}.chip,.action{background:transparent;color:var(--ink);border:1px solid var(--line);padding:calc(10 * var(--u)) calc(24 * var(--u));font-size:calc(28 * var(--u))}.chip.selected{background:var(--celadon);border-color:var(--celadon);color:var(--paper)}.gallery-layout{height:100%;display:flex;flex-direction:column}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(28 * var(--u));overflow:auto;padding:calc(12 * var(--u));margin:calc(-12 * var(--u));scrollbar-color:var(--line) transparent;scroll-padding:calc(14 * var(--u));min-height:0}.card{background:none;text-align:left;border:none;padding:0;color:var(--ink);min-width:0}.thumb{width:100%;aspect-ratio:4/3;height:auto;padding:calc(8 * var(--u));background:var(--surface);display:block;margin-bottom:calc(14 * var(--u))}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.card-title{font-size:calc(28 * var(--u));display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.card-meta{font-size:calc(23 * var(--u));color:var(--muted)}.viewer{position:absolute;inset:0;background:#19241f;display:flex;align-items:center;justify-content:center;color:#f2eee5;padding:calc(42 * var(--u))}.viewer>img{height:100%;width:100%;object-fit:contain}.viewer-tag{position:absolute;top:calc(28 * var(--u));left:calc(40 * var(--u));padding:calc(8 * var(--u)) calc(14 * var(--u));background:#19241fea;color:#e5e6dd;font-size:calc(24 * var(--u))}.viewer-bottom{position:absolute;bottom:calc(28 * var(--u));left:calc(40 * var(--u));right:calc(40 * var(--u));display:flex;align-items:center;justify-content:space-between;font-size:calc(24 * var(--u));background:#19241feb;padding:calc(12 * var(--u)) calc(20 * var(--u))}.overlay{position:absolute;inset:0;display:flex;align-items:flex-end;background:#15201b33;padding:calc(72 * var(--u))}.panel{background:var(--paper);color:var(--ink);padding:calc(42 * var(--u));border:1px solid var(--line);width:100%;display:flex;align-items:center;gap:calc(40 * var(--u));box-shadow:0 8px 40px #0003}.panel h2{font:500 calc(42 * var(--u))/1.3 AtriumTitle,serif;margin:0 0 calc(10 * var(--u))}.panel p{font-size:calc(28 * var(--u));margin:0;color:var(--muted)}.panel .actions{margin-left:auto;display:flex;gap:calc(28 * var(--u))}.notice{position:absolute;left:calc(72 * var(--u));right:calc(72 * var(--u));top:calc(134 * var(--u));padding:calc(18 * var(--u)) calc(28 * var(--u));background:#f2eee5;color:#783d29;border-left:calc(6 * var(--u)) solid #8B4A35;font-size:calc(28 * var(--u));z-index:5;box-shadow:0 6px 18px #0002}.status-layout{display:grid;grid-template-columns:1fr 1.45fr;gap:calc(96 * var(--u));height:100%;padding-top:calc(32 * var(--u))}.lead{font-size:calc(32 * var(--u));color:var(--muted);max-width:18em;margin:calc(32 * var(--u)) 0}.state-table{border-top:1px solid var(--line)}.state-row{border-bottom:1px solid var(--line);padding:calc(26 * var(--u)) 0;display:flex;justify-content:space-between;gap:calc(24 * var(--u));font-size:calc(30 * var(--u))}.state-row span{color:var(--muted)}.state-row strong{font-weight:400;text-align:right}.settings-tabs{display:flex;flex-direction:column;align-items:stretch;gap:calc(24 * var(--u));margin-top:calc(48 * var(--u));max-width:calc(400 * var(--u))}.settings-tabs .chip{text-align:left}.buttons{display:flex;gap:calc(28 * var(--u));margin-top:calc(42 * var(--u))}.empty-layout{height:100%;display:flex;align-items:center;gap:calc(110 * var(--u));padding:0 calc(80 * var(--u))}.empty-mark{width:calc(280 * var(--u));height:calc(320 * var(--u));border:1px solid var(--line);display:grid;place-items:center;position:relative;background:var(--surface);font:400 calc(100 * var(--u))/1 AtriumTitle,serif;color:var(--celadon)}.empty-mark:after{content:'';position:absolute;inset:calc(18 * var(--u));border:1px solid var(--line)}.pair-code{font-size:calc(100 * var(--u));letter-spacing:.16em;font-variant-numeric:tabular-nums;margin:calc(24 * var(--u)) 0;color:var(--celadon)}.center-overlay{align-items:center;justify-content:center;background:#19241f77}.center-overlay .panel{width:calc(830 * var(--u));display:block}.center-overlay .actions{margin:calc(40 * var(--u)) 0 0}.warning{color:#8B4A35}.screen.night .warning{color:#e2a98e}@media (max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.review{height:36px;font-size:10px;gap:8px}.stage{height:calc(100dvh - 36px)}.brand span{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<div class="review" aria-label="原型评审工具，非产品界面"><strong>ATRIUM / 设计评审</strong><label>场景<select id="scenario"><option value="home">首页 · 纸白</option><option value="library">集合与图库</option><option value="viewer">单图 · 完整比例</option><option value="pair">连接与配对</option><option value="settings">设置与状态</option><option value="loading">正在加载</option><option value="empty">暂无照片</option><option value="nas">NAS 不可用</option><option value="offline">连接断开</option><option value="failed">单图加载失败</option><option value="denied">授权已失效</option><option value="tls">证书验证失败</option><option value="removed">资源已移除</option></select></label><button id="night">墨夜首页对照</button><button id="reset">重置</button><label>后续设计<select id="future"><option value="">仅供评审</option><option>家庭简报</option><option>房屋信息</option><option>家庭日历</option><option>视频</option></select></label><span class="hint">本地原创示例 · 无设备连接</span></div>
<div class="stage"><main class="screen" id="screen" aria-label="Atrium TV 产品原型"></main></div>
<script>
'use strict';
const photos=[
{id:'lake',title:'山湖之间',file:'landscape.svg',date:'2026 年 9 月 12 日',kind:'横图'},
{id:'path',title:'林间小径',file:'portrait.svg',date:'2026 年 9 月 12 日',kind:'竖图'},
{id:'mountain',title:'远山与暮色',file:'panorama.svg',date:'2026 年 9 月 11 日',kind:'全景'},
{id:'court',title:'一方庭院',file:'courtyard.svg',date:'拍摄时间未知',kind:'日期未知'},
{id:'long',title:'沿着山湖慢慢走过的一个悠长下午，直到夕光落在远处的水面上',file:'landscape.svg',date:'2026 年 9 月 10 日',kind:'长标题'},
{id:'path2',title:'树影',file:'portrait.svg',date:'拍摄时间未知',kind:'竖图'},
{id:'court2',title:'庭前',file:'courtyard.svg',date:'2026 年 9 月 9 日',kind:'横图'},
{id:'mountain2',title:'山色入水',file:'panorama.svg',date:'2026 年 9 月 8 日',kind:'全景'},
{id:'lake2',title:'湖边停留',file:'landscape.svg',date:'2026 年 9 月 7 日',kind:'横图'},
{id:'court3',title:'午后光影',file:'courtyard.svg',date:'拍摄时间未知',kind:'日期未知'},
{id:'path3',title:'小径尽头',file:'portrait.svg',date:'2026 年 9 月 6 日',kind:'竖图'},
{id:'mountain3',title:'晚山',file:'panorama.svg',date:'2026 年 9 月 5 日',kind:'全景'}];
const collections=[['recent','最近新增'],['today','今天拍摄'],['random','随心看看'],['all','全部照片']];
const initial=()=>({authorized:true,route:'home',focus:'hero',collection:'recent',index:0,sequence:photos.map(p=>p.id),stack:[],overlay:false,exit:false,night:false,status:'online',settingsTab:'devices',returnStack:[],notice:'',error:'empty',slideshow:false,failed:false,sketch:''});let s=initial();const screen=document.querySelector('#screen');
const escapeHTML=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const visible=()=>s.collection==='today'?photos.slice(0,2):s.collection==='random'?[photos[2],photos[0],photos[3],photos[1]]:photos;
const photo=()=>photos.find(p=>p.id===s.sequence[s.index])||photos[0];
function button(id,label,cls='action',extra=''){return `<button data-action="${id}" class="${cls}${s.focus===id?' focus':''}" ${extra}>${label}</button>`}
function nav(){return `<nav class="nav" aria-label="主要导航">${[['home','首页'],['library','照片'],['settings','设置']].map(([r,l])=>button('nav-'+r,l,(s.route===r?'selected ':'')+'nav-item',s.route===r?'aria-current="page"':'')).join('')}<span class="keyhint">方向键移动 · 确认打开 · 返回上一级</span></nav>`}
function header(){return `<header class="masthead"><div class="brand">ATRIUM<span>留一方光景</span></div><span class="sample">本地原创插画 · 示例内容</span></header>`}
function home(){return `<div class="home"><div class="photo-wrap">${button('hero','<img src="assets/landscape.svg" alt="示例横图：山湖与帆船">','hero','aria-label="打开山湖之间示例照片"')}<div class="photo-caption"><b>山湖之间</b><span>示例插画 · 09 / 12</span></div></div><aside class="clock-column"><div><div class="date">九月十二日 · 星期六</div><div class="clock">16:28</div><div class="divider"></div><h1 class="home-title">把日子，<br>留在眼前。</h1><p class="quiet">确认照片，慢慢翻看。<br>时间与日期均为示例。</p></div>${button('status',`<span><i class="dot"></i>${s.status==='offline'?'连接已断开':s.status==='nas'?'照片来源暂不可用':'照片中枢已连接'}</span><span>查看 ›</span>`,'status')}</aside></div>`}
function library(){return `<section class="gallery-layout"><div class="page-top"><h1 class="page-heading">照片</h1><span class="sample">${visible().length} 张示例 · 最近新增指首次发现</span></div><div class="collections" aria-label="照片集合">${collections.map(([id,label])=>button('collection-'+id,(s.collection===id?'✓ ':'')+label,'chip'+(s.collection===id?' selected':''),'aria-pressed="'+(s.collection===id)+'"')).join('')}</div><div class="grid" id="grid">${visible().map(p=>button('photo-'+p.id,`<span class="thumb"><img src="assets/${p.file}" alt="${p.kind}示例插画" loading="eager"></span><span class="card-title">${escapeHTML(p.title)}</span><span class="card-meta">示例 · ${p.kind}</span>`,'card','aria-label="'+escapeHTML(p.title+'，'+p.kind)+'"')).join('')}</div></section>`}
function viewer(){const p=photo();return `<section class="viewer"><img src="assets/${p.file}" alt="${escapeHTML(p.title)}，${p.kind}示例，完整比例"><span class="viewer-tag">示例插画 · ${p.kind} · ${s.slideshow?'轮播演示已启用':'手动看图'}</span><div class="viewer-bottom"><span>← 上一张　${s.index+1} / ${s.sequence.length}　下一张 →</span><span>确认 ${s.overlay?'关闭':'查看'}操作 · 返回${s.overlay?'关闭操作层':'来源页面'}</span></div></section>${s.overlay?`<div class="overlay"><section class="panel"><div style="min-width:0;max-width:60%"><h2>${escapeHTML(p.title)}</h2><p>${p.date} · 示例数据</p></div><div class="actions">${button('slideshow',s.slideshow?'停止轮播':'开始轮播')}${button('close-controls','关闭操作')}</div></section></div>`:''}`}
function settings(){const tabs=[['devices','连接状态'],['photos','照片来源'],['about','关于 Atrium']];const detail=s.settingsTab==='photos'?`<div class="state-row"><span>照片来源</span><strong>NAS 授权目录 · 示例</strong></div><div class="state-row"><span>读取状态</span><strong>${s.status==='nas'?'暂不可用':'可读取 · 示例'}</strong></div><div class="state-row"><span>读取范围</span><strong>由维护端配置</strong></div><p class="quiet">屏幕只读展示授权范围。最近新增指首次发现；未知拍摄时间保持未知。</p>`:s.settingsTab==='about'?`<div class="state-row"><span>当前屏幕</span><strong>客厅屏幕 · 示例</strong></div><div class="state-row"><span>版本</span><strong>设计原型 v1</strong></div><p class="quiet">本地原创插画与示例数据。<br>这是设计评审原型，没有连接真实设备。<br>字体：本地 Noto Serif SC / Noto Sans SC。</p>`:`<div class="state-row"><span>照片中枢</span><strong>${s.status==='offline'?'连接已断开':'已连接 · 示例'}</strong></div><div class="state-row"><span>NAS 照片来源</span><strong>${s.status==='nas'?'暂不可用':'可读取 · 示例'}</strong></div><div class="state-row"><span>当前屏幕</span><strong>客厅屏幕 · 示例</strong></div><div class="state-row"><span>最近检查</span><strong>16:28 · 示例时间</strong></div><p class="quiet">中枢在线不代表房屋环境正常。</p>`;return `<section class="status-layout"><div><h1 class="page-heading">设置与状态</h1><div class="settings-tabs">${tabs.map(([id,label])=>button('setting-'+id,(s.settingsTab===id?'✓ ':'')+label,'chip'+(s.settingsTab===id?' selected':''),'aria-pressed="'+(s.settingsTab===id)+'"')).join('')}</div><p class="quiet">选择项目，按确认查看。</p></div><div class="state-table">${detail}<div class="buttons">${button('connect','连接设置')}${button('retry-status','重新检查')}</div></div></section>`}
function pair(){return `<section class="status-layout"><div><h1 class="page-heading">连接家中 Atrium</h1><p class="lead">在维护端输入配对码，<br>让这块屏幕加入照片展示。</p><p class="quiet">演示码不能用于实际配对。<br>原型不会保存凭据或访问网络。</p><div class="buttons">${button('demo-pair','模拟配对完成')}${button('back','返回')}</div></div><div><div class="state-row"><span>配对对象</span><strong>Atrium 照片中枢 · 示例</strong></div><div class="pair-code">268 419</div><p class="quiet">示例配对码 · 仅用于布局评审</p><div class="divider"></div><p>由维护端核对中枢与屏幕。<br>证书验证通过后才能建立连接。</p></div></section>`}
const errors={loading:['候','正在读取照片','正在准备示例内容，请稍候。','模拟完成'],empty:['空','这里还没有照片','当前集合没有可显示的照片。可以换一个集合，或查看来源状态。','查看全部照片'],nas:['源','照片来源暂不可用','NAS 暂时不可读取。仍有有效授权的已缓存照片可继续展示。','返回可用照片'],offline:['连','与照片中枢的连接已断开','显示上次可用内容；新内容与控制暂时不可用。连接恢复后再更新状态。','返回可用照片'],denied:['权','照片授权已失效','当前照片已停止展示。请在维护端检查授权，再重新连接。','连接设置'],tls:['证','无法验证中枢证书','请在维护端检查证书与中枢地址，然后重试连接。','重试连接']};
function empty(){const [mark,title,desc,action]=errors[s.error]||errors.empty;return `<section class="empty-layout"><div class="empty-mark" aria-hidden="true">${mark}</div><div><h1 class="page-heading">${title}</h1><p class="lead" style="max-width:31em">${desc}</p><p class="quiet">当前为 ${s.error} 状态设计示例。</p><div class="buttons">${button('recover',action)}${button('open-status','查看状态')}</div></div></section>`}
function render({scroll,keepFocus=false}={}){const hadProductFocus=screen.contains(document.activeElement);const oldScroll=document.querySelector('#grid')?.scrollTop||0;screen.className='screen'+(s.night&&s.route==='home'?' night':'');screen.innerHTML=s.route==='viewer'?viewer():header()+`<div class="content">${({home,library,settings,pair,empty})[s.route]()}</div>`+(s.route==='pair'?'':nav());if(s.exit)screen.innerHTML+=`<div class="overlay center-overlay"><section class="panel"><h2>继续留在这里？</h2><p>退出只是原型演示，不会关闭设备应用。</p><div class="actions">${button('continue','继续使用')}${button('exit-demo','退出演示')}</div></section></div>`;if(s.sketch)screen.innerHTML+=`<div class="overlay center-overlay"><section class="panel"><h2>${escapeHTML(s.sketch)} · 后续设计</h2><p>${s.sketch==='视频'?'仅手动播放；需真实授权样本验证格式、声音、跳转及退出。':s.sketch==='家庭日历'?'尚未连接日历。只读议程需明确授权来源、家庭时区与公共字段。':s.sketch==='房屋信息'?'仅中枢状态可作为首期来源；房间资料与环境传感器尚未接入。':'来源未连接、成功无事项、数据过期与同步失败必须分别呈现。'}<br>此页是设计说明，不是可用产品入口。</p><div class="actions">${button('close-sketch','返回评审')}</div></section></div>`;if(s.notice)screen.innerHTML+=`<div class="notice" role="status">${escapeHTML(s.notice)}</div>`;const grid=document.querySelector('#grid');if(grid)grid.scrollTop=scroll??oldScroll;if(!keepFocus||hadProductFocus){const el=screen.querySelector(`[data-action="${s.focus}"]`);el?.focus({preventScroll:true});if(scroll===undefined&&s.focus.startsWith('photo-'))el?.scrollIntoView({block:'nearest',inline:'nearest'});}}
function go(route,focus){if(!s.authorized&&['home','library','viewer'].includes(route)){route='empty';focus='recover';s.error='denied'}s.route=route;s.focus=focus;s.notice='';s.overlay=false;s.exit=false;render({scroll:0})}
function navigate(route,focus){if(!s.authorized&&['home','library','viewer'].includes(route)){go(route,focus);return}s.returnStack.push({route:s.route,focus:s.focus,collection:s.collection,scroll:document.querySelector('#grid')?.scrollTop||0});go(route,focus)}
function enterViewer(id){if(!s.authorized){s.error='denied';go('empty','recover');return}s.stack.push({route:s.route,focus:s.focus,collection:s.collection,scroll:document.querySelector('#grid')?.scrollTop||0});s.sequence=(s.route==='library'?visible():photos).map(p=>p.id);s.index=Math.max(0,s.sequence.indexOf(id));s.route='viewer';s.overlay=false;s.focus='viewer';s.slideshow=false;s.notice='';render()}
function back(){if(!s.authorized){s.overlay=false;s.exit=false;s.sketch='';s.stack=[];s.returnStack=[];s.error='denied';go('empty','recover');return}if(s.sketch){s.sketch='';s.focus=s.savedFocus||'hero';render();return}if(s.exit){s.exit=false;s.focus='hero';render();return}if(s.overlay){s.overlay=false;s.focus='viewer';render();return}if(s.route==='viewer'){const origin=s.stack.pop()||{route:'home',focus:'hero',collection:'recent',scroll:0};Object.assign(s,{...origin,slideshow:false,notice:'',failed:false});render({scroll:origin.scroll});return}if(s.route==='home'){if(s.focus!=='hero'){s.focus='hero';render()}else{s.exit=true;s.focus='continue';render()}return}const origin=s.returnStack.pop();if(origin){Object.assign(s,origin,{notice:''});render({scroll:origin.scroll});return}go('home','hero')}
function activate(id){if(id.startsWith('nav-')){const r=id.slice(4);navigate(r,r==='home'?'hero':r==='library'?'collection-'+s.collection:'setting-'+s.settingsTab);return}if(id==='hero'){enterViewer('lake');return}if(id.startsWith('photo-')){s.focus=id;enterViewer(id.slice(6));return}if(id.startsWith('collection-')){s.collection=id.slice(11);s.focus='photo-'+visible()[0].id;render({scroll:0});return}if(id==='status'||id==='open-status'){navigate('settings','setting-'+s.settingsTab);return}if(id.startsWith('setting-')){s.settingsTab=id.slice(8);s.focus=id;render();return}if(id==='connect'){navigate('pair','demo-pair');return}if(id==='demo-pair'){s.authorized=true;s.status='online';s.error='empty';s.stack=[];s.returnStack=s.returnStack.filter(origin=>['home','library','settings'].includes(origin.route));back();s.notice='配对成功 · 仅模拟，未建立真实连接';render();return}if(id==='retry-status'){s.notice='检查完成 · 仍为示例状态，未请求真实中枢';render();return}if(id==='back'){back();return}if(id==='recover'){if(s.error==='tls'){s.notice='示例：证书验证仍失败，请维护端检查；没有跳过验证入口';render();return}if(s.error==='denied'){go('pair','demo-pair');return}if(s.error==='empty'){s.collection='all';go('library','collection-all');return}go('home','hero');return}if(id==='continue'){s.exit=false;s.focus='hero';render();return}if(id==='exit-demo'){s.exit=false;s.notice='退出动作已演示；页面保持打开';s.focus='hero';render();return}if(id==='close-controls'){s.overlay=false;s.focus='viewer';render();return}if(id==='slideshow'){s.slideshow=!s.slideshow;s.notice=s.slideshow?'轮播状态演示；此原型不设置自动切图定时器':'已停止轮播，保持当前单图';render();return}if(id==='close-sketch'){back();return}}
function move(direction){if(s.route==='viewer'&&!s.overlay&&!s.sketch&&!s.exit){if(direction==='left'||direction==='right'){const n=Math.max(0,Math.min(s.sequence.length-1,s.index+(direction==='left'?-1:1)));if(s.failed&&direction==='right'){s.notice='下一张加载失败，已保留当前图；再次按右跳过示例故障';s.failed=false}else{s.index=n;s.notice=''}render()}return}let next=s.focus;const horizontal=direction==='left'||direction==='right';const step=direction==='left'?-1:1;let row=[];if(s.sketch)row=['close-sketch'];else if(s.exit)row=['continue','exit-demo'];else if(s.overlay)row=['slideshow','close-controls'];else if(s.focus.startsWith('nav-')){row=['nav-home','nav-library','nav-settings'];if(direction==='up')next=s.route==='home'?'hero':s.route==='library'?'collection-'+s.collection:s.route==='settings'?'setting-'+s.settingsTab:'recover'}else if(s.route==='home'){if(s.focus==='hero')next=direction==='right'?'status':direction==='down'?'nav-home':'hero';else if(s.focus==='status')next=direction==='left'?'hero':direction==='down'?'nav-settings':'status'}else if(s.route==='library'){if(s.focus.startsWith('collection-')){row=collections.map(c=>'collection-'+c[0]);if(direction==='down')next='photo-'+visible()[0].id}else if(s.focus.startsWith('photo-')){const ids=visible().map(p=>'photo-'+p.id),i=ids.indexOf(s.focus),cols=getComputedStyle(document.querySelector('#grid')).gridTemplateColumns.split(' ').length;let n=i;if(direction==='left'&&i%cols>0)n=i-1;if(direction==='right'&&i%cols<cols-1&&i<ids.length-1)n=i+1;if(direction==='up'){if(i<cols)next='collection-'+s.collection;else n=i-cols}if(direction==='down'){if(i+cols<ids.length)n=i+cols;else if(i>=Math.floor((ids.length-1)/cols)*cols)next='nav-library'}if(next===s.focus)next=ids[n]}}else if(s.route==='settings'){if(s.focus.startsWith('setting-')){const tabs=['setting-devices','setting-photos','setting-about'],i=tabs.indexOf(s.focus);if(direction==='up')next=tabs[Math.max(0,i-1)];if(direction==='down')next=i===tabs.length-1?'nav-settings':tabs[i+1];if(direction==='right')next='connect'}else{row=['connect','retry-status'];if(direction==='left'&&s.focus==='connect')next='setting-'+s.settingsTab;if(direction==='down')next='nav-settings'}}else{row=s.route==='pair'?['demo-pair','back']:['recover','open-status'];if(direction==='down'&&s.route!=='pair')next='nav-'+(s.route==='settings'?'settings':'home')}if(horizontal&&row.length&&next===s.focus){const i=row.indexOf(s.focus);next=row[Math.max(0,Math.min(row.length-1,i+step))]||s.focus}s.focus=next;render()}
function dispatch(action){if(action==='back'){back();return}if(['left','right','up','down'].includes(action)){move(action);return}if(action==='enter'){if(s.route==='viewer'&&!s.overlay&&!s.sketch){s.overlay=true;s.focus='close-controls';render()}else activate(s.focus);return}activate(action)}
screen.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){s.focus=b.dataset.action;dispatch('enter')}else if(s.route==='viewer')dispatch('enter')});document.addEventListener('keydown',e=>{if(e.target.closest('.review'))return;const key={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Enter:'enter',Escape:'back',Backspace:'back'}[e.key];if(key){e.preventDefault();if(e.repeat&&['enter','back'].includes(key))return;dispatch(key)}});
document.querySelector('#reset').onclick=()=>{const authorized=s.authorized;s=initial();s.authorized=authorized;if(!authorized){s.route='empty';s.error='denied';s.focus='recover'}document.querySelector('#scenario').value='home';document.querySelector('#future').value='';render()};document.querySelector('#night').onclick=()=>{const night=!s.night,authorized=s.authorized;s=initial();s.night=night;s.authorized=authorized;if(!authorized){s.route='empty';s.error='denied';s.focus='recover'}render()};document.querySelector('#future').onchange=e=>{if(!e.target.value)return;s.savedFocus=s.focus;s.sketch=e.target.value;s.focus='close-sketch';render();e.target.value=''};
document.querySelector('#scenario').onchange=e=>{const v=e.target.value;if(['nas','offline'].includes(v)){s.status=v;s.notice=v==='nas'?'示例：NAS 暂不可用；保留有效授权的当前内容':'示例：连接断开；保留当前页面与焦点';render({keepFocus:true});return}if(v==='failed'){if(s.route!=='viewer')enterViewer('lake');s.failed=true;s.notice='加载失败场景：按右模拟下一张失败，当前图片保持可见';render({keepFocus:true});return}if(v==='removed'){if(s.route!=='viewer')enterViewer('lake');const old=photo().id;s.overlay=false;back();if(s.route==='library'){const list=visible(),i=list.findIndex(p=>p.id===old);s.focus='photo-'+list[i+1<list.length?i+1:Math.max(0,i-1)].id}s.notice='示例：当前资源已移除，返回最近有效位置；示例列表保留用于重复评审';render();return}s.notice='';s.overlay=false;s.exit=false;s.sketch='';if(v==='viewer'){enterViewer('path');return}if(['loading','empty','denied','tls'].includes(v)){if(v==='denied'){s.authorized=false;s.stack=[];s.returnStack=[];s.sequence=[];s.index=0;s.slideshow=false}s.error=v;go('empty','recover');return}go(v,v==='home'?'hero':v==='library'?'collection-'+s.collection:v==='pair'?'demo-pair':'setting-'+s.settingsTab)};
window.atriumPrototype={dispatch,snapshot:()=>({...s,scroll:document.querySelector('#grid')?.scrollTop||0}),setScenario:value=>{const e=document.querySelector('#scenario');e.value=value;e.dispatchEvent(new Event('change'))}};render();
</script></html>
