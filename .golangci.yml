version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - nolintlint

  settings:
    errcheck:
      check-type-assertions: true
      # Writing a CLI banner to stdout cannot fail in a way the command can act
      # on; the exit status already reflects the operation itself.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: package-comments

  exclusions:
    generated: lax
    paths:
      - web/node_modules
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - bodyclose
      - path: internal/store/
        text: "G201|G202"
        linters:
          - gosec
      # Test fixture generators build byte-level image headers; the integer
      # conversions are bounded by the fixtures themselves and the files they
      # write are test data, not production output.
      - path: internal/media/testutil/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - web/node_modules

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
