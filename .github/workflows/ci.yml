name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint --if-present

      - name: Test
        working-directory: web
        run: npm test --if-present

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          scripts="$(git ls-files '*.sh')"
          if [ -n "$scripts" ]; then
            # shellcheck disable=SC2086
            shellcheck $scripts
          fi

  release:
    name: Release binaries
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download the web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Build macOS binaries with the embedded UI
        run: make release
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}

      - name: Upload atrium-darwin-arm64
        uses: actions/upload-artifact@v4
        with:
          name: atrium-darwin-arm64
          path: bin/atrium-darwin-arm64
          retention-days: 14

      - name: Upload atrium-darwin-amd64
        uses: actions/upload-artifact@v4
        with:
          name: atrium-darwin-amd64
          path: bin/atrium-darwin-amd64
          retention-days: 14
