# Atrium Home Hub — example configuration.
# Copy to config.yaml and edit. Every key below shows its default value.
# State (screens, pairings, index) lives in SQLite, not in this file.

home:
  name: "Home"
  timezone: "Asia/Singapore"          # IANA name; required. Do not infer a location from it.

server:
  listen: "0.0.0.0:8443"
  public_url: "https://192.168.1.10:8443"   # origin the TV opens; used for Origin checks and TLS SANs
  extra_sans: []                      # e.g. ["macmini.local"]
  allowed_origins: []                 # defaults to the origin of public_url + localhost variants
  tls:
    mode: "auto"                      # auto | file | off (off = insecure demo only)
    cert_file: ""
    key_file: ""

storage:
  data_dir: "~/Library/Application Support/Atrium"
  cache_budget_bytes: 10737418240     # 10 GiB
  min_free_bytes: 5368709120          # pause preview generation below 5 GiB free

sources:
  - id: "family_photos"
    name: "Family photos"
    root: "/Volumes/photos/family"    # read-only mount; nothing outside this root is ever read
    include_extensions: ["jpg", "jpeg", "png", "heic", "heif"]
    identity:
      require_mount: true             # root must be on a network filesystem distinct from its parent
      allow_local: false              # development only
      marker_file: ""                 # optional file that must exist inside root
    scan:
      interval: "60s"
      stability_interval: "5s"
      stability_checks: 2
      stability_max_rounds: 3
    io_timeout: "20s"
    max_inflight: 8

media:
  workers: 2
  decode_timeout: "30s"
  preview_max_edge: 2560
  preview_max_bytes: 1048576
  thumb_max_edge: 480
  max_pixels: 80000000
  max_source_bytes: 62914560
  heic:
    converter: "sips"                 # sips | off
  # Add mp4/mov to the existing source include_extensions to enable video.
  # Covers reserve 10% (up to 512 MiB) of storage.cache_budget_bytes.
  video:
    ffprobe: ""                       # Empty: PATH; launchd may need /opt/homebrew/bin/ffprobe
    ffmpeg: ""                        # Empty: PATH; launchd may need /opt/homebrew/bin/ffmpeg

screens:
  heartbeat_interval: "15s"
  offline_after: "45s"
  command_ttl: "10s"
  slideshow_interval: "30s"

widgets:
  weather:
    enabled: false
    provider: "open-meteo"
    latitude: 0
    longitude: 0
    location_label: ""
    refresh_interval: "30m"
    stale_after: "2h"
  notice:
    # Optional RFC 3339 timestamps with offsets. Omit or leave empty when unknown.
    # updated_at is the actual content modification time, not the config load time.
    # The notice is shown from valid_from (inclusive) until valid_until (exclusive).
    # valid_until must be later than valid_from when both are present.
    # updated_at: "2026-09-12T10:00:00+08:00"
    # valid_from: "2026-09-12T10:00:00+08:00"
    # valid_until: "2026-09-13T10:00:00+08:00"
    enabled: false
    text: ""

logging:
  level: "info"                       # debug | info | warn | error
  retain_days: 7
  max_total_mb: 200

backup:
  enabled: false
  dir: ""                             # must be outside every source root and outside data_dir
  time: "03:00"
  keep: 7
